a{color:#4F46E5;text-decoration:none;}a:hover{color:#4338CA;}

::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#E2E4EE;border-radius:8px;}::-webkit-scrollbar-track{background:transparent;}
