  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px;border-radius:3px;background:#DDD6FE\"><\u002Fspan>Tablet 7%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #ECEDF4;border-radius:14px;padding:18px 20px\">\n        <div style=\"font-size:13.5px;font-weight:800;color:#14152A\">By country<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:14px\">\n          <sc-for list=\"{{ countries }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-size:14px\">{{ c.flag }}<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:#3C3F55;width:92px\">{{ c.name }}<\u002Fspan><span style=\"flex:1;height:6px;border-radius:99px;background:#F3F3FA\"><span style=\"display:block;height:6px;border-radius:99px;background:linear-gradient(90deg,#4F46E5,#8B5CF6);width:{{ c.width }}\"><\u002Fspan><\u002Fspan><span style=\"font-size:11.5px;font-weight:800;color:#14152A\">{{ c.pct }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #ECEDF4;border-radius:14px;padding:18px 20px\">\n        <div style=\"font-size:13.5px;font-weight:800;color:#14152A\">By email client<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;margin-top:14px\">\n          <sc-for list=\"{{ clients }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:9px\"><span style=\"font-size:13px\">{{ c.glyph }}<\u002Fspan><span style=\"font-size:12px;font-weight:700;color:#3C3F55;width:92px\">{{ c.name }}<\u002Fspan><span style=\"flex:1;height:6px;border-radius:99px;background:#F3F3FA\"><span style=\"display:block;height:6px;border-radius:99px;background:{{ c.color }};width:{{ c.width }}\"><\u002Fspan><\u002Fspan><span style=\"font-size:11.5px;font-weight:800;color:#14152A\">{{ c.pct }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { page: (location.hash || '#revenue').slice(1) };\n  componentDidMount() {\n    this.hh = () => { this.setState({ page: (location.hash || '#revenue').slice(1) }); this.rebuild(); };\n    window.addEventListener('hashchange', this.hh);\n    this.rebuild();\n  }\n  componentWillUnmount() { window.removeEventListener('hashchange', this.hh); clearTimeout(this.rt); this.destroy(); }\n  destroy() { [this.mc, this.dc].forEach(c => c && c.destroy()); this.mc = null; this.dc = null; }\n  cfg() {\n    const days = Array.from({length: 30}, (_, i) => 'Jun ' + (i + 1));\n    const wave = (base, amp, slope, f = 3.5) => days.map((_, i) => base + Math.sin(i / f) * amp + i * slope);\n    const map = {\n      revenue: { type: 'line', label: v => '$' + (v / 1000).toFixed(1) + 'k', sets: [['Total', wave(3200, 700, 45), '#4F46E5'], ['Email-attributed', wave(1300, 380, 22), '#C4B5FD']] },\n      open: { type: 'line', label: v => v.toFixed(0) + '%', sets: [['Open rate', wave(36, 4, 0.08), '#4F46E5'], ['Industry avg', days.map(() => 24.8), '#E0D7FE']] },\n      click: { type: 'line', label: v => v.toFixed(1) + '%', sets: [['Click rate', wave(4.6, 0.9, 0.012), '#8B5CF6']] },\n      conversions: { type: 'bar', label: v => v.toFixed(0), sets: [['Conversions', wave(130, 34, 1.2), '#4F46E5']] },\n      autorev: { type: 'line', label: v => '$' + (v / 1000).toFixed(1) + 'k', sets: [['Automation revenue', wave(1500, 420, 18), '#7C3AED']] },\n      performance: { type: 'line', label: v => v.toFixed(0) + '%', sets: [['Delivered', wave(99, 0.4, 0), '#0E9F6E'], ['Opened', wave(37, 3, 0.06), '#4F46E5'], ['Clicked', wave(4.9, 0.8, 0.01), '#C4B5FD']] },\n      clv: { type: 'bar', label: v => '$' + v.toFixed(0), sets: [['Avg CLV by cohort month', [310, 348, 365, 402, 421, 456, 480, 512, 540, 575, 590, 618].concat(Array(18).fill(null)), '#8B5CF6']] },\n    };\n    return { days, ...(map[this.pageKey()] || map.revenue) };\n  }\n  pageKey() {\n    const valid = ['revenue', 'open', 'click', 'conversions', 'autorev', 'performance', 'clv'];\n    return valid.includes(this.state.page) ? this.state.page : 'revenue';\n  }\n  rebuild() {\n    clearTimeout(this.rt);\n    const ok = window.Chart && this.mainEl && this.mainEl.isConnected && this.deviceEl && this.deviceEl.isConnected;\n    if (!ok) { this.rt = setTimeout(() => this.rebuild(), 150); return; }\n    Chart.defaults.font.family = \"'Manrope',sans-serif\"; Chart.defaults.color = '#A5A8BD';\n    this.destroy();\n    if (this.mainEl) {\n      const c = this.cfg();\n      this.mc = new Chart(this.mainEl, { type: c.type,\n        data: { labels: c.days, datasets: c.sets.map((s, i) => ({ label: s[0], data: s[1],\n          borderColor: s[2], backgroundColor: c.type === 'bar' ? s[2] : s[2] + '22',\n          fill: c.type === 'line' && i === 0, tension: .4, borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, borderRadius: 5, barPercentage: .6 })) },\n        options: { maintainAspectRatio: false, plugins: { legend: { display: c.sets.length > 1, labels: { boxWidth: 9, boxHeight: 9, font: { size: 11, weight: 700 } } } },\n          scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8, font: { size: 10, weight: 600 } } },\n            y: { border: { display: false }, grid: { color: '#F3F3FA' }, ticks: { maxTicksLimit: 5, font: { size: 10, weight: 600 }, callback: c.label } } } } });\n      if (!this.mc.canvas.isConnected) { this.destroy(); this.rt = setTimeout(() => this.rebuild(), 150); return; }\n    }\n    if (this.deviceEl) {\n      this.dc = new Chart(this.deviceEl, { type: 'pie',\n        data: { labels: ['Mobile', 'Desktop', 'Tablet'], datasets: [{ data: [62, 31, 7], backgroundColor: ['#4F46E5', '#8B5CF6', '#DDD6FE'], borderWidth: 2, borderColor: '#fff' }] },\n        options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } });\n    }\n  }\n  renderVals() {\n    const page = this.pageKey();\n    const meta = {\n      revenue: ['Revenue', 'Store revenue and what email drove', 'Revenue over time', 'Total vs. email-attributed, daily', 'Revenue by source', 'Attributed last-click',\n        [['REVENUE', '$128,460', '+18.2%', 1], ['EMAIL-ATTRIBUTED', '$52,740', '41% of total', 1], ['AVG ORDER VALUE', '$45.10', '+$3.20', 1], ['REVENUE / RECIPIENT', '$0.38', '+$0.06', 1]],\n        [['⚙️', 'Automations', '$52.7k', '82%', '#4F46E5'], ['✉️', 'Campaigns', '$41.2k', '64%', '#8B5CF6'], ['🛒', 'Organic', '$24.9k', '39%', '#C4B5FD'], ['🔍', 'Search', '$6.2k', '10%', '#E0D7FE'], ['📣', 'Social', '$3.5k', '5%', '#EFEFF7']]],\n      open: ['Open Rate', 'Who opens, when, and on what', 'Open rate trend', 'Daily unique opens vs. industry average', 'Top flows by open rate', 'Last 30 days',\n        [['OPEN RATE', '38.4%', '+2.1pt', 1], ['UNIQUE OPENS', '130,346', '+8.4%', 1], ['BOUNCE RATE', '0.8%', '-0.1pt', 1], ['SPAM RATE', '0.02%', 'Healthy', 1]],\n        [['👑', 'VIP Loyalty', '64.8%', '92%', '#4F46E5'], ['👋', 'Welcome Series', '58.1%', '83%', '#8B5CF6'], ['📦', 'Back In Stock', '51.6%', '74%', '#C4B5FD'], ['🛒', 'Cart Recovery', '46.2%', '66%', '#E0D7FE'], ['💫', 'Win Back', '31.4%', '45%', '#EFEFF7']]],\n      click: ['Click Rate', 'Engagement past the open', 'Click rate trend', 'Daily unique clicks / delivered', 'Most-clicked content', 'By block type',\n        [['CLICK RATE', '4.9%', '+0.6pt', 1], ['CLICK-TO-OPEN', '12.8%', '+0.9pt', 1], ['UNIQUE CLICKS', '16,633', '+12.1%', 1], ['UNSUBSCRIBE', '0.14%', 'Stable', 1]],\n        [['🔘', 'CTA buttons', '6,910', '86%', '#4F46E5'], ['🛍️', 'Product cards', '4,820', '60%', '#8B5CF6'], ['🖼️', 'Hero images', '2,410', '30%', '#C4B5FD'], ['🎟️', 'Coupon blocks', '1,890', '24%', '#E0D7FE'], ['⭐', 'Review blocks', '603', '8%', '#EFEFF7']]],\n      conversions: ['Conversions', 'From click to order', 'Daily conversions', 'Orders attributed to email clicks', 'Conversion by flow', 'Orders / enrolled',\n        [['CONVERSIONS', '4,172', '+9.8%', 1], ['CONV RATE', '3.2%', '-0.2pt', 0], ['REVENUE / CONV', '$46.20', '+$2.80', 1], ['TIME TO CONVERT', '9.4h', 'median', 1]],\n        [['🛒', 'Cart Recovery', '23.4%', '88%', '#4F46E5'], ['📦', 'Back In Stock', '18.2%', '68%', '#8B5CF6'], ['👋', 'Welcome Series', '13.9%', '52%', '#C4B5FD'], ['💫', 'Win Back', '9.1%', '34%', '#E0D7FE'], ['👀', 'Browse Abandon', '7.2%', '27%', '#EFEFF7']]],\n      autorev: ['Automation Revenue', 'What your flows earn while you sleep', 'Automation revenue', 'Daily revenue from all live flows', 'Revenue by flow', 'Last 30 days',\n        [['AUTOMATION REVENUE', '$52,740', '+24.1%', 1], ['SHARE OF TOTAL', '41%', '+4pt', 1], ['PER RECIPIENT', '$1.42', '+$0.18', 1], ['LIVE FLOWS', '6', '+2', 1]],\n        [['🛒', 'Cart Recovery', '$18.4k', '92%', '#4F46E5'], ['👋', 'Welcome Series', '$12.8k', '64%', '#8B5CF6'], ['💫', 'Win Back', '$9.3k', '47%', '#C4B5FD'], ['👀', 'Browse Abandon', '$7.6k', '38%', '#E0D7FE'], ['👑', 'VIP Loyalty', '$3.9k', '20%', '#EFEFF7']]],\n      performance: ['Email Performance', 'Deliverability and engagement health', 'Engagement over time', 'Delivered, opened and clicked rates', 'Health checks', 'Deliverability signals',\n        [['DELIVERED', '99.2%', 'Excellent', 1], ['BOUNCE', '0.8%', '-0.1pt', 1], ['SPAM COMPLAINTS', '0.02%', 'Healthy', 1], ['UNSUBSCRIBE', '0.14%', 'Stable', 1]],\n        [['✅', 'SPF / DKIM / DMARC', 'Pass', '100%', '#0E9F6E'], ['📬', 'Inbox placement', '96.4%', '96%', '#4F46E5'], ['🔥', 'Sender reputation', '94 / 100', '94%', '#8B5CF6'], ['⏱️', 'Avg send latency', '1.2s', '30%', '#C4B5FD'], ['📤', 'Queue backlog', '0', '4%', '#EFEFF7']]],\n      clv: ['Customer Lifetime Value', 'How value compounds by cohort', 'CLV by signup cohort', 'Average 12-month value per cohort month', 'CLV by segment', 'Average lifetime value',\n        [['AVG CLV', '$486', '+$42', 1], ['VIP AVG CLV', '$2,640', '+$180', 1], ['PAYBACK PERIOD', '38 days', '-6 days', 1], ['REPEAT RATE', '31.4%', '+3.8pt', 1]],\n        [['👑', 'VIP', '$2,640', '96%', '#4F46E5'], ['💜', 'Loyal', '$1,180', '44%', '#8B5CF6'], ['🌱', 'New', '$212', '9%', '#C4B5FD'], ['⚠️', 'At risk', '$820', '31%', '#E0D7FE'], ['😴', 'Lapsed', '$640', '24%', '#EFEFF7']]],\n    };\n    const m = meta[page];\n    return {\n      sidebarKey: page,\n      pageTitle: m[0], pageSub: m[1], chartTitle: m[2], chartSub: m[3], sideTitle: m[4], sideSub: m[5],\n      tabs: [['Revenue', '#revenue'], ['Open Rate', '#open'], ['Click Rate', '#click'], ['Conversions', '#conversions'], ['Automation Rev', '#autorev'], ['Performance', '#performance'], ['CLV', '#clv']].map(t => {\n        const key = t[1].slice(1);\n        return { label: t[0], href: t[1], weight: page === key ? 800 : 600, color: page === key ? '#4F46E5' : '#8A8DA3', border: page === key ? '#4F46E5' : 'transparent' };\n      }),\n      kpis: m[6].map(k => ({ label: k[0], value: k[1], delta: k[2], deltaColor: k[3] ? '#0E9F6E' : '#E02424' })),\n      sideRows: m[7].map(r => ({ glyph: r[0], label: r[1], value: r[2], width: r[3], color: r[4] })),\n      countries: [\n        { flag: '🇺🇸', name: 'United States', pct: '48%', width: '96%' }, { flag: '🇬🇧', name: 'United Kingdom', pct: '16%', width: '32%' },\n        { flag: '🇨🇦', name: 'Canada', pct: '12%', width: '24%' }, { flag: '🇦🇺', name: 'Australia', pct: '9%', width: '18%' },\n        { flag: '🇩🇪', name: 'Germany', pct: '6%', width: '12%' },\n      ],\n      clients: [\n        { glyph: '📮', name: 'Apple Mail', pct: '44%', width: '88%', color: '#4F46E5' }, { glyph: '📧', name: 'Gmail', pct: '38%', width: '76%', color: '#8B5CF6' },\n        { glyph: '📨', name: 'Outlook', pct: '11%', width: '22%', color: '#C4B5FD' }, { glyph: '📬', name: 'Yahoo', pct: '4%', width: '8%', color: '#E0D7FE' },\n        { glyph: '✉️', name: 'Other', pct: '3%', width: '6%', color: '#EFEFF7' },\n      ],\n      mainRef: (el) => { if (el && el !== this.mainEl) { this.mainEl = el; this.rebuild(); } }, deviceRef: (el) => { if (el && el !== this.deviceEl) { this.deviceEl = el; this.rebuild(); } },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
