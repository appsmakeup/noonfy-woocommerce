<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Manrope',-apple-system,sans-serif;background:#0C0D1E;}
a{color:#A5B4FC;text-decoration:none;}a:hover{color:#C7D2FE;}
*{box-sizing:border-box;}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:#26284A;border-radius:8px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
</style>
</helmet>
<div style="display:flex;min-height:100vh;background:#0C0D1E">
  <dc-import name="Sidebar" active="command" hint-size="248px,100vh"></dc-import>
  <main style="flex:1;min-width:0;padding:0 28px 40px 28px;color:#E6E7F5;display:flex;flex-direction:column">
    <header style="padding:20px 0 16px 0">
      <h1 style="margin:0;font-size:21px;font-weight:800;color:#fff;letter-spacing:-.3px;display:flex;align-items:center;gap:9px">AI Command Center<span style="font-size:10px;font-weight:800;color:#C4B5FD;background:rgba(124,58,237,.25);border-radius:99px;padding:3px 9px;letter-spacing:.5px">ASK ANYTHING</span></h1>
      <p style="margin:3px 0 0 0;font-size:12.5px;color:#8E90B8;font-weight:500">Ask in plain English — Noonfy finds customers, builds automations and surfaces answers instantly.</p>
    </header>

    <section style="background:#15162D;border:1px solid #24264A;border-radius:16px;display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0">
      <div ref="{{ scrollRef }}" style="flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px;min-height:340px">
        <sc-for list="{{ messages }}" as="m" hint-placeholder-count="3">
          <div style="display:flex;gap:11px;justify-content:{{ m.justify }};animation:msgIn .3s ease">
            <sc-if value="{{ m.isAi }}" hint-placeholder-val="{{ true }}">
              <span style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4F46E5,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">✨</span>
            </sc-if>
            <div style="max-width:{{ m.maxw }};background:{{ m.bg }};border:1px solid {{ m.border }};border-radius:13px;padding:13px 15px">
              <div style="font-size:13px;font-weight:{{ m.weight }};color:{{ m.color }};line-height:1.5">{{ m.text }}</div>
              <sc-if value="{{ m.hasResult }}" hint-placeholder-val="{{ false }}">
                <div style="margin-top:11px">
                  <sc-if value="{{ m.isList }}" hint-placeholder-val="{{ false }}">
                    <div style="display:flex;flex-direction:column;gap:7px">
                      <sc-for list="{{ m.rows }}" as="r" hint-placeholder-count="4">
                        <div style="display:flex;align-items:center;gap:10px;background:#10112A;border:1px solid #24264A;border-radius:9px;padding:8px 11px">
                          <span style="width:26px;height:26px;border-radius:99px;background:{{ r.tint }};display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:{{ r.fg }}">{{ r.initials }}</span>
                          <span style="flex:1;min-width:0"><span style="display:block;font-size:12px;font-weight:700;color:#E6E7F5">{{ r.name }}</span><span style="display:block;font-size:10.5px;color:#8E90B8;font-weight:600">{{ r.detail }}</span></span>
                          <span style="font-size:11px;font-weight:800;color:{{ r.metricColor }}">{{ r.metric }}</span>
                        </div>
                      </sc-for>
                    </div>
                  </sc-if>
                  <sc-if value="{{ m.isFlow }}" hint-placeholder-val="{{ false }}">
                    <div style="display:flex;flex-wrap:wrap;gap:7px;align-items:center">
                      <sc-for list="{{ m.chips }}" as="c" hint-placeholder-count="5">
                        <span style="font-size:10.5px;font-weight:800;color:{{ c.color }};background:{{ c.bg }};border:1px solid {{ c.border }};border-radius:8px;padding:5px 10px">{{ c.label }}</span>
                      </sc-for>
                    </div>
                  </sc-if>
                  <sc-if value="{{ m.isStat }}" hint-placeholder-val="{{ false }}">
                    <div style="display:flex;gap:9px">
                      <sc-for list="{{ m.stats }}" as="s" hint-placeholder-count="3">
                        <div style="background:#10112A;border:1px solid #24264A;border-radius:10px;padding:11px 14px"><div style="font-size:9.5px;font-weight:800;color:#8E90B8">{{ s.label }}</div><div style="font-size:17px;font-weight:800;color:#fff;margin-top:3px">{{ s.value }}</div></div>
                      </sc-for>
                    </div>
                  </sc-if>
                  <a href="{{ m.ctaHref }}" style="display:inline-block;margin-top:11px;background:linear-gradient(135deg,#4F46E5,#8B5CF6);color:#fff;border-radius:8px;padding:7px 14px;font-size:11.5px;font-weight:800" style-hover="opacity:.9;color:#fff">{{ m.cta }}</a>
                </div>
              </sc-if>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{ thinking }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:11px"><span style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4F46E5,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:14px">✨</span><div style="background:#1A1B36;border:1px solid #24264A;border-radius:13px;padding:13px 16px;display:flex;gap:5px;align-items:center"><span style="width:7px;height:7px;border-radius:99px;background:#8B5CF6;animation:blink 1s ease infinite"></span><span style="width:7px;height:7px;border-radius:99px;background:#8B5CF6;animation:blink 1s ease .2s infinite"></span><span style="width:7px;height:7px;border-radius:99px;background:#8B5CF6;animation:blink 1s ease .4s infinite"></span></div></div>
        </sc-if>
      </div>
      <div style="border-top:1px solid #24264A;padding:14px 18px">
        <div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px">
          <sc-for list="{{ prompts }}" as="p" hint-placeholder-count="4">
            <button onClick="{{ p.onClick }}" style="border:1px solid #2C2E52;background:#1A1B36;color:#C7D2FE;border-radius:99px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit" style-hover="border-color:#4F46E5">{{ p.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex;gap:10px;align-items:center;background:#10112A;border:1px solid #2C2E52;border-radius:12px;padding:6px 6px 6px 15px">
          <input ref="{{ inputRef }}" onKeyDown="{{ onKey }}" placeholder="Ask Noonfy anything about your store…" style="flex:1;border:none;outline:none;background:transparent;color:#fff;font-size:13.5px;font-weight:600;font-family:'Manrope',sans-serif"></input>
          <button onClick="{{ send }}" style="border:none;background:linear-gradient(135deg,#4F46E5,#8B5CF6);color:#fff;border-radius:9px;padding:9px 16px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit">Ask →</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { messages: [], thinking: false };
  componentDidMount() {
    this.answers = this.buildAnswers();
    this.setState({ messages: [{ role: 'ai', text: 'Hi Sam 👋 Ask me to find customers, build an automation, or pull any metric. Try one of the suggestions below.' }] });
  }
  componentWillUnmount() { clearTimeout(this.t); }
  buildAnswers() {
    const tint = ['#F1EBFE', '#EEF0FE', '#EDF9F1', '#FFF3E8'];
    const fg = ['#7C3AED', '#4F46E5', '#0E9F6E', '#C2620A'];
    const person = (name, detail, metric, i, mc) => ({ name, detail, metric, initials: name.split(' ').map(w => w[0]).join(''), tint: tint[i % 4], fg: fg[i % 4], metricColor: mc || '#A78BFA' });
    return [
      { match: ['viewed', 'iphone', 'never', 'not purchas', 'browse'], text: 'Found 2,148 customers who viewed a product but never purchased it. Top intent scores:',
        result: { type: 'list', rows: [person('Elena Moreau', 'Viewed Linen Duvet 3× · wishlisted', '94', 0), person('Jonas Lindqvist', 'Viewed Alpaca Throw 2×', '71', 1), person('Hana Suzuki', 'Added to cart, removed', '68', 2), person('Marcus Webb', 'Wishlisted 5 days ago', '62', 3)] },
        cta: 'Send them a nudge flow', ctaHref: 'AIBuilder.dc.html' },
      { match: ['abandon', 'cart', 'create', 'build', 'automation'], text: 'Done — I drafted an Abandoned Cart automation with 3 emails and a 10% coupon after 48h:',
        result: { type: 'flow', chips: [['⚡ Cart abandoned', '#7C3AED'], ['⏱️ Wait 2h', '#C2620A'], ['✉️ Reminder', '#4F46E5'], ['🎟️ 10% after 48h', '#7C3AED'], ['✉️ Last chance', '#4F46E5'], ['🏁 Purchase', '#0E9F6E']] },
        cta: 'Open in builder', ctaHref: 'AIBuilder.dc.html' },
      { match: ['churn', 'likely to', 'lapse', 'at risk'], text: '1,208 customers have a churn probability above 70%. The highest-value ones:',
        result: { type: 'list', rows: [person('Jonas Lindqvist', 'No opens in 6 weeks', '84% risk', 0, '#F87171'), person('Alice Fontaine', 'Unsubscribed from SMS', '81% risk', 1, '#F87171'), person('Marcus Webb', 'Refunded last order', '72% risk', 2, '#F87171')] },
        cta: 'Enroll in Win Back', ctaHref: 'AI.dc.html#predictive' },
      { match: ['best', 'perform', 'email', 'top', 'campaign'], text: 'Your best-performing email this quarter by attributed revenue:',
        result: { type: 'stat', stats: [['CAMPAIGN', 'Flash Sale'], ['REVENUE', '$8,420'], ['OPEN RATE', '41.2%']] },
        cta: 'View campaign', ctaHref: 'Analytics.dc.html#performance' },
      { match: ['revenue', 'how much', 'made', 'sales'], text: 'You\u2019ve earned $128,460 this month — $93,940 attributed to email:',
        result: { type: 'stat', stats: [['TOTAL', '$128.5k'], ['EMAIL', '$93.9k'], ['ROI', '42×']] },
        cta: 'Open attribution', ctaHref: 'Attribution.dc.html' },
    ];
  }
  respond(q) {
    const query = q.toLowerCase();
    let best = null, bestScore = 0;
    this.answers.forEach(a => { const score = a.match.filter(m => query.includes(m)).length; if (score > bestScore) { bestScore = score; best = a; } });
    if (!best) best = { text: 'I can search customers, build automations, and pull any metric. Try “show customers who viewed a product but never bought,” “create an abandoned cart automation,” or “find customers likely to churn.”' };
    return best;
  }
  ask(text) {
    if (!text || !text.trim()) return;
    const userMsg = { role: 'user', text: text.trim() };
    this.setState(s => ({ messages: [...s.messages, userMsg], thinking: true }));
    this.scrollSoon();
    clearTimeout(this.t);
    this.t = setTimeout(() => {
      const a = this.respond(text);
      const aiMsg = { role: 'ai', text: a.text, result: a.result, cta: a.cta, ctaHref: a.ctaHref };
      this.setState(s => ({ messages: [...s.messages, aiMsg], thinking: false }));
      this.scrollSoon();
    }, 1100);
  }
  scrollSoon() { setTimeout(() => { if (this.scrollEl) this.scrollEl.scrollTop = this.scrollEl.scrollHeight; }, 60); }
  renderVals() {
    const messages = this.state.messages.map(m => {
      const isAi = m.role === 'ai';
      const r = m.result;
      return { isAi, justify: isAi ? 'flex-start' : 'flex-end', maxw: isAi ? '78%' : '70%',
        bg: isAi ? '#1A1B36' : 'linear-gradient(135deg,#4F46E5,#8B5CF6)', border: isAi ? '#24264A' : 'transparent',
        color: isAi ? '#E6E7F5' : '#fff', weight: isAi ? 600 : 700, text: m.text,
        hasResult: !!r, isList: r && r.type === 'list', isFlow: r && r.type === 'flow', isStat: r && r.type === 'stat',
        rows: r && r.rows || [], stats: r && r.stats ? r.stats.map(s => ({ label: s[0], value: s[1] })) : [],
        chips: r && r.chips ? r.chips.map(c => ({ label: c[0], color: c[1], bg: c[1] + '22', border: c[1] + '55' })) : [],
        cta: m.cta || '', ctaHref: m.ctaHref || '#' };
    });
    const prompts = [
      'Show customers who viewed a product but never purchased',
      'Create an abandoned cart automation',
      'Find customers likely to churn',
      'Show my best performing email',
    ].map(p => ({ label: p, onClick: () => this.ask(p) }));
    return {
      messages, thinking: this.state.thinking, prompts,
      scrollRef: (el) => { this.scrollEl = el; },
      inputRef: (el) => { this.inputEl = el; },
      onKey: (e) => { if (e.key === 'Enter') { this.ask(e.target.value); e.target.value = ''; } },
      send: () => { if (this.inputEl) { this.ask(this.inputEl.value); this.inputEl.value = ''; } },
    };
  }
}
</script>
</body>
</html>
