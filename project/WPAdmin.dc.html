<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#f0f0f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen-Sans,Ubuntu,Cantarell,"Helvetica Neue",sans-serif;}
*{box-sizing:border-box;}
a{text-decoration:none;}
aside{scrollbar-width:none;-ms-overflow-style:none;}
aside::-webkit-scrollbar{width:0;height:0;}
aside::-webkit-scrollbar-thumb{background:#4b5563;border-radius:8px;}
aside::-webkit-scrollbar-track{background:transparent;}
</style>
</helmet>
<div style="height:100vh;overflow:hidden;background:#f0f0f1;position:relative">
  <div style="position:absolute;top:0;left:0;right:0;height:32px;background:#1d2327;display:flex;align-items:center;color:#f0f0f1;font-size:13px;z-index:30;transform:translateY({{ barY }});transition:transform .28s ease;will-change:transform">
    <div style="display:flex;align-items:center;height:100%">
      <span style="display:flex;align-items:center;justify-content:center;width:34px;height:32px;cursor:pointer" style-hover="background:#2c3338">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="#a7aaad"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 1.4c1.9 0 3.6.7 4.9 1.8h-.2c-.6 0-1.1.5-1.1 1.1 0 .5.3.9.6 1.4.2.4.5.9.5 1.7 0 .5-.2 1.2-.5 2.1l-.6 2.1-2.3-6.8c.4 0 .7-.1.7-.1.3 0 .3-.5 0-.5 0 0-1.1.1-1.8.1-.6 0-1.7-.1-1.7-.1-.3 0-.4.5 0 .5 0 0 .3 0 .7.1l1 2.7-1.4 4.2-2.3-6.9c.4 0 .7-.1.7-.1.3 0 .3-.5 0-.5 0 0-1.1.1-1.8.1h-.4A8.6 8.6 0 0 1 12 3.4zM3.4 12c0-1.2.3-2.4.7-3.4l3.9 10.7A8.6 8.6 0 0 1 3.4 12zm8.6 8.6c-.8 0-1.7-.1-2.4-.4l2.6-7.4 2.6 7.2v.2c-.9.3-1.8.4-2.8.4zm4-1.2 2.4-7c.5-1.1.6-2 .6-2.8v-.4c1 1.7 1.5 3.7 1.5 5.8 0 1.8-.4 3.5-1.3 5-.8 1.4-1.9 2.6-3.2 3.4z"/></svg>
      </span>
      <span style="display:flex;align-items:center;gap:7px;padding:0 10px;height:100%;color:#f0f0f1;font-size:13px;cursor:pointer" style-hover="background:#2c3338;color:#72aee6">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#a7aaad"><path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z"/></svg>Bruma Home
      </span>
      <span style="display:flex;align-items:center;gap:6px;padding:0 10px;height:100%;color:#f0f0f1;cursor:pointer" style-hover="background:#2c3338;color:#72aee6">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a7aaad" stroke-width="2"><path d="M4 4v6h6M20 20v-6h-6"></path><path d="M20 9A8 8 0 0 0 6 5.3L4 7M4 15a8 8 0 0 0 14 3.7l2-1.7"></path></svg>2
      </span>
      <span style="display:flex;align-items:center;gap:6px;padding:0 10px;height:100%;color:#f0f0f1;cursor:pointer" style-hover="background:#2c3338;color:#72aee6">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#a7aaad"><path d="M20 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3v4l5-4h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
        <span style="background:#d63638;color:#fff;border-radius:9px;padding:1px 6px;font-size:11px;font-weight:600">4</span>
      </span>
      <span style="display:flex;align-items:center;gap:6px;padding:0 10px;height:100%;color:#f0f0f1;cursor:pointer" style-hover="background:#2c3338;color:#72aee6">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a7aaad" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New
      </span>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;height:100%">
      <span style="display:flex;align-items:center;justify-content:center;width:34px;height:32px;cursor:pointer" style-hover="background:#2c3338">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a7aaad" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg>
      </span>
      <span style="display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;height:100%;color:#f0f0f1;cursor:pointer" style-hover="background:#2c3338;color:#72aee6">
        Howdy, Sam
        <span style="width:20px;height:20px;border-radius:2px;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700">S</span>
      </span>
    </div>
  </div>

  <aside id="wpadminbar-scroll" style="position:absolute;top:32px;left:0;bottom:0;width:{{ menuWidth }};background:#1d2327;overflow-y:auto;overflow-x:hidden;z-index:20;transform:translateX({{ menuX }});transition:transform .28s ease,width .2s ease;will-change:transform">
    <sc-for list="{{ wpMenu }}" as="m" hint-placeholder-count="11">
      <div>
        <a href="{{ m.href }}" style="display:flex;align-items:center;gap:{{ m.gap }};padding:{{ m.pad }};font-size:14px;line-height:1.4;color:{{ m.color }};background:{{ m.bg }};border-left:4px solid {{ m.accent }};position:relative;overflow:hidden" style-hover="background:#2c3338;color:#72aee6">
          <span style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-start"><svg width="17" height="17" viewBox="0 0 24 24" fill="{{ m.iconFill }}">{{ m.icon }}</svg></span>
          <sc-if value="{{ m.showLabel }}" hint-placeholder-val="{{ true }}"><span style="flex:1;min-width:0;white-space:normal;overflow-wrap:normal;word-break:normal">{{ m.label }}</span></sc-if>
          <sc-if value="{{ m.badge }}" hint-placeholder-val="{{ false }}"><span style="background:#d63638;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600;flex-shrink:0;position:{{ m.badgePos }};top:{{ m.badgeTop }};right:{{ m.badgeRight }}">{{ m.badge }}</span></sc-if>
        </a>
        <sc-if value="{{ m.hasSub }}" hint-placeholder-val="{{ false }}">
          <div style="background:#2c3338;padding:6px 0 8px 0">
            <sc-for list="{{ m.sub }}" as="s" hint-placeholder-count="6">
              <a href="{{ s.href }}" target="{{ s.target }}" style="display:block;padding:6px 12px 6px 37px;font-size:13px;line-height:1.4;color:{{ s.color }};font-weight:{{ s.weight }};white-space:normal;overflow-wrap:normal;word-break:normal" style-hover="color:#72aee6">{{ s.label }}</a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <div style="border-top:1px solid #33383d;margin-top:8px">
      <a onClick="{{ toggleCollapse }}" style="display:flex;align-items:center;gap:{{ collapseGap }};padding:9px 0 9px 12px;font-size:13px;color:#a7aaad;cursor:pointer;white-space:nowrap;overflow:hidden" style-hover="color:#72aee6">
        <span style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ collapseIcon }}"></path></svg></span>
        <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}"><span>Collapse menu</span></sc-if>
      </a>
    </div>
  </aside>

  <div style="position:absolute;top:{{ frameTop }};left:{{ frameLeft }};right:0;bottom:0;transition:top .28s ease,left .28s ease;background:#F6F6FB">
    <iframe src="{{ pluginSrc }}" title="Plugin" style="width:100%;height:100%;border:none;display:block"></iframe>
  </div>

  <button onClick="{{ toggleChrome }}" style="position:fixed;right:18px;bottom:18px;z-index:60;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);background:#1d2327;color:#f0f0f1;border-radius:999px;padding:10px 16px;font-size:12.5px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;cursor:pointer;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.28)" style-hover="background:#2c3338">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ toggleIcon }}"></path></svg>
    {{ toggleLabel }}
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { chrome: true, collapsed: false };
  renderVals() {
    const P = (d) => d;
    const icons = {
      dashboard: 'M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z',
      posts: 'M4 3h11l5 5v13H4zM14 3v6h6',
      media: 'M4 5h16v14H4zm3 9 3-3 3 3 3-4 3 5H7z',
      pages: 'M6 2h8l4 4v16H6zM14 2v5h5',
      comments: 'M20 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h3v4l5-4h8a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z',
      appearance: 'M12 2a9 9 0 0 0 0 18h2a3 3 0 0 0 3-3 2 2 0 0 1 2-2h1a3 3 0 0 0 3-3 10 10 0 0 0-11-10zM6.5 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z',
      plugins: 'M10 2v6H7a3 3 0 0 0 0 6h3v8h4v-8h3a3 3 0 0 0 0-6h-3V2z',
      users: 'M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 5.5V22h18v-2.5c0-3-4-5.5-9-5.5z',
      tools: 'M21 3 14 10l-1-1a5 5 0 0 0-7-7l3 3-2 2-3-3a5 5 0 0 0 7 7l1 1-7 7 2 2 7-7 5 5 3-3-5-5 7-7z',
      settings: 'M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zm8.9-2.1.1-1.4-.1-1.4 2-1.6-2-3.4-2.4.9a7.7 7.7 0 0 0-2.4-1.4L15.7 2h-3.9l-.4 2.6a7.7 7.7 0 0 0-2.4 1.4L6.6 5 4.6 8.4l2 1.6-.1 1.4.1 1.4-2 1.6 2 3.4 2.4-.9a7.7 7.7 0 0 0 2.4 1.4l.4 2.7h3.9l.4-2.7a7.7 7.7 0 0 0 2.4-1.4l2.4.9 2-3.4z',
      plugin: 'M12 2 3 7v10l9 5 9-5V7zm0 4.2 5 2.8-5 2.8L7 9z',
    };
    const collapsed = this.state.collapsed;
    const showLabels = !collapsed;
    const M = (label, icon, key, badge, sub) => {
      const active = key === 'plugin';
      return { label, icon: React.createElement('path', { d: icons[icon] }), iconFill: active ? '#fff' : '#a7aaad',
        href: '#', badge: badge || '', showLabel: showLabels, gap: collapsed ? '0' : '10px', pad: collapsed ? '9px 0 9px 12px' : '9px 12px',
        color: active ? '#fff' : '#f0f0f1', bg: active ? '#2271b1' : 'transparent', accent: active ? '#72aee6' : 'transparent',
        badgePos: collapsed ? 'absolute' : 'static', badgeTop: collapsed ? '4px' : 'auto', badgeRight: collapsed ? '2px' : 'auto',
        hasSub: !!(sub && sub.length && !collapsed), sub: (sub || []) };
    };
    const S = (label, href, active, target) => ({ label, href, target: target || '_self', color: active ? '#72aee6' : '#c3c4c7', weight: active ? 600 : 400 });
    const pluginSub = [
      S('Dashboard', 'Dashboard.dc.html', true, '_top'),
      S('Customers', 'Contacts.dc.html#customers', false, '_top'),
      S('Campaigns', 'Campaigns.dc.html#all', false, '_top'),
      S('Automation', 'Automations.dc.html#workflows', false, '_top'),
      S('Push Notifications', 'Push.dc.html#dashboard', false, '_top'),
      S('Analytics', 'Analytics.dc.html#revenue', false, '_top'),
      S('Settings', 'Settings.dc.html#smtp', false, '_top'),
    ];
    const wpMenu = [
      M('Dashboard', 'dashboard', 'dashboard'),
      M('Posts', 'posts', 'posts'),
      M('Media', 'media', 'media'),
      M('Pages', 'pages', 'pages'),
      M('Comments', 'comments', 'comments', '4'),
      M('AI Customer Engagement', 'plugin', 'plugin', '', pluginSub),
      M('Appearance', 'appearance', 'appearance'),
      M('Plugins', 'plugins', 'plugins', '2'),
      M('Users', 'users', 'users'),
      M('Tools', 'tools', 'tools'),
      M('Settings', 'settings', 'settings'),
    ];
    const on = this.state.chrome;
    return {
      wpMenu, showLabels,
      menuWidth: collapsed ? '36px' : '160px',
      menuX: on ? '0' : '-100%',
      barY: on ? '0' : '-100%',
      frameTop: on ? '32px' : '0',
      frameLeft: on ? (collapsed ? '36px' : '160px') : '0',
      pluginSrc: 'Dashboard.dc.html',
      collapseGap: collapsed ? '0' : '10px',
      collapseIcon: collapsed ? 'M9 6l6 6-6 6' : 'M15 6l-6 6 6 6',
      toggleCollapse: () => this.setState(s => ({ collapsed: !s.collapsed })),
      toggleChrome: () => this.setState(s => ({ chrome: !s.chrome })),
      toggleLabel: on ? 'Hide WordPress Sidebar' : 'Show WordPress Sidebar',
      toggleIcon: on ? 'M18 6 6 18M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16',
    };
  }
}
</script>
</body>
</html>
